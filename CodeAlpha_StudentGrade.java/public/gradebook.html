<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gradebook · HTML, CSS, and JavaScript</title>
    <link rel="stylesheet" href="/gradebook.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Plain HTML gradebook</h1>
          <p>This page uses HTML, CSS, and JavaScript. It reads and writes the same PostgreSQL grade table as the React app.</p>
        </div>
        <a href="/">Back to React app</a>
      </header>

      <section class="stats" id="stats" aria-live="polite"></section>

      <form id="grade-form">
        <h2>Add or edit a grade</h2>
        <input id="editing-id" type="hidden" />
        <div class="grid">
          <label>Roll number<input name="rollNo" required placeholder="R-1042" /></label>
          <label>Class<input name="className" required value="Grade 10" /></label>
          <label class="wide">Student name<input name="studentName" required placeholder="Student name" /></label>
          <label class="wide">Subject<input name="subject" required value="Mathematics" /></label>
          <label>Score<input name="score" type="number" min="0" max="1000" required /></label>
          <label>Max score<input name="maxScore" type="number" min="1" max="1000" value="100" required /></label>
        </div>
        <div class="actions">
          <button id="submit-button" type="submit">Add grade</button>
          <button id="cancel-edit" class="secondary" type="button" hidden>Cancel</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </form>

      <section>
        <h2>Summary report</h2>
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>Class</th>
              <th>Subject</th>
              <th>Score</th>
              <th>Percent</th>
              <th>Grade</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="grade-rows"></tbody>
        </table>
      </section>
    </main>
    <script src="/gradebook.js"></script>
  </body>
</html>
